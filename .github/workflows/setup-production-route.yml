name: Setup Production Route

on:
  workflow_dispatch:

jobs:
  setup-route:
    runs-on: ubuntu-latest
    steps:
      - name: Create Workers route for yohomefix.com
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/cb7b2bc2dedd183daf447a65894c61c6/workers/routes" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_ACCOUNT_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"pattern":"yohomefix.com/*","script":"pseo-plumbing-site"}'
        env:
          CLOUDFLARE_ACCOUNT_TOKEN: ${{ secrets.CLOUDFLARE_ACCOUNT_TOKEN }}
